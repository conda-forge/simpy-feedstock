# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.1.2"
  python_check_max: "3.14"

package:
  name: simpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/simpy/simpy-${{ version }}.tar.gz
  sha256: 76ef36b71e0436ba94e55febc001c78879e493a323f045bbcfbb0b216e9b1fbc

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=8.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - simpy
        - simpy.resources
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/
    script:
      file: run_test.py

about:
  summary: Event discrete, process based simulation for Python.
  license: MIT
  license_file: LICENSE.rst
  homepage: https://pypi.org/project/simpy
  repository: https://gitlab.com/team-simpy/simpy
  documentation: https://simpy.readthedocs.io

extra:
  recipe-maintainers:
    - bollwyvl
