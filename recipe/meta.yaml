{% set version = "4.1.2" %}

package:
  name: simpy
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/simpy/simpy-{{ version }}.tar.gz
  sha256: 76ef36b71e0436ba94e55febc001c78879e493a323f045bbcfbb0b216e9b1fbc

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools_scm >=8.0
    - setuptools >=64
  run:
    - python >={{ python_min }}

test:
  source_files:
    - tests
  imports:
    - simpy
    - simpy.resources
  commands:
    - pip check
  requires:
    - pip
    - pytest
    - pytest-benchmark
    - pytest-cov
    - python {{ python_min }}

about:
  home: https://simpy.readthedocs.io
  summary: Event discrete, process based simulation for Python.
  license: MIT
  license_file: LICENSE.rst
  dev_url: https://gitlab.com/team-simpy/simpy
  doc_url: https://simpy.readthedocs.io
  doc_source_url: https://gitlab.com/team-simpy/simpy/-/tree/{{ version }}/docs

extra:
  recipe-maintainers:
    - bollwyvl
